<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Pengurus Skidipapap</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen p-4">
    <main class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-100">
        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold text-indigo-600">LOGIN</h1>
            <p class="text-slate-400 mt-2">Silahkan masuk ke akun pengurus</p>
        </header>
        
        <section>
            <form action="index.html" class="space-y-4">
                <div>
                    <label for="email" class="sr-only">Email</label>
                    <input type="email" id="email" placeholder="Email" class="input-field" required>
                </div>
                <div>
                    <label for="password" class="sr-only">Password</label>
                    <input type="password" id="password" placeholder="Password" class="input-field" required>
                </div>
                <button type="submit" class="btn-primary">LOGIN</button>
            </form>
        </section>

        <footer class="flex justify-between mt-6 text-sm text-indigo-500 font-medium">
            <a href="#" class="hover:underline">Create Account</a>
            <a href="#" class="hover:underline">Forget Password</a>
        </footer>
    </main>
</body>
</html>

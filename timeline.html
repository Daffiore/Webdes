<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timeline - Pengurus Skidipapap</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50 flex min-h-screen">
    <div id="app" class="flex w-full">
        <aside class="w-64 bg-white border-r border-slate-200 flex flex-col">
            <nav class="flex-1 p-4 mt-16 space-y-2">
                <a href="index.html" class="nav-item"><i class="fas fa-home mr-3"></i> Beranda</a>
                <a href="timeline.html" class="nav-item active"><i class="fas fa-calendar-alt mr-3"></i> Timeline Aktivitas</a>
            </nav>
        </aside>

        <main class="flex-1 overflow-y-auto">
            <header class="bg-white border-b px-8 py-4 flex justify-between items-center">
                <h1 class="text-xl font-bold">Timeline Aktivitas</h1>
                <nav class="flex space-x-6 text-sm font-medium text-slate-500">
                    <a href="index.html">Home</a>
                    <a href="#" class="text-indigo-600">Timeline</a>
                </nav>
            </header>
            <section class="p-8 max-w-2xl mx-auto">
                <div class="border-l-4 border-indigo-100 ml-4 space-y-10">
                    <article v-for="event in timelines" class="relative pl-8">
                        <div class="absolute -left-[14px] top-0 w-6 h-6 bg-indigo-600 rounded-full border-4 border-white shadow-sm"></div>
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                            <time :datetime="event.date" class="text-indigo-600 font-bold text-sm block mb-1">{{ event.date }}</time>
                            <h2 class="text-slate-800 font-bold text-lg">{{ event.title }}</h2>
                        </div>
                    </article>
                </div>
            </section>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
